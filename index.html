<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOBON × LinkPrice 광고 제안서</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { margin: 0; font-family: 'Pretendard', sans-serif; background: #faf8f5; overflow: hidden; }
    #deck { display: flex; transition: transform 0.5s ease; width: 200vw; height: 100vh; }
    .slide { width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 0 10%; box-sizing: border-box; }
    h1 { font-size: 3rem; line-height: 1.3; margin-bottom: 1rem; }
    h2 { font-size: 2rem; margin-bottom: 2rem; }
    .grid3 { display: flex; gap: 2rem; }
    .grid3 article { flex: 1; padding: 2rem; background: #fff; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .nav { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; }
    button { padding: 10px 20px; cursor: pointer; }
</style>
</head>
<body>
<main id="deck">
  <section class="slide">
    <h1>구매 가능성이 높은 고객을<br><strong>다시 움직이게 만드는 데이터 전략</strong></h1>
    <p>단순 노출을 넘어 핵심 고객을 찾아 성과로 연결합니다.</p>
  </section>
  <section class="slide">
    <h2>고객과의 ‘정확한 재접점’</h2>
    <div class="grid3">
      <article><h3>비교·검토 단계</h3><p>구매 확신이 부족한 고객을 재설득합니다.</p></article>
      <article><h3>구매 의도 분석</h3><p>행동 데이터 기반 맞춤 메시지를 전달합니다.</p></article>
      <article><h3>성장 동력 확보</h3><p>효율 최적화를 통한 매출 확대를 지원합니다.</p></article>
    </div>
  </section>
</main>
<div class="nav">
  <button id="prev">← 이전</button>
  <button id="next">다음 →</button>
</div>
<script>
    let currentSlide = 0;
    const deck = document.getElementById('deck');
    function updateSlide() { deck.style.transform = `translateX(-${currentSlide * 100}vw)`; }
    document.getElementById('prev').onclick = () => { if(currentSlide > 0) { currentSlide--; updateSlide(); } };
    document.getElementById('next').onclick = () => { if(currentSlide < 1) { currentSlide++; updateSlide(); } };
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') document.getElementById('prev').click();
        if (e.key === 'ArrowRight') document.getElementById('next').click();
    });
</script>
</body>
</html>
